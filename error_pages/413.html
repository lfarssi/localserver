<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>413 Payload Too Large</title>
  <style>
    body { font-family: "Georgia", serif; background: #f6f5f1; color: #1b1b1b; margin: 0; }
    .wrap { max-width: 720px; margin: 10vh auto; padding: 24px; }
    h1 { font-size: 40px; margin: 0 0 8px; }
    p { font-size: 18px; line-height: 1.5; margin: 0; }
    .code { font-size: 14px; opacity: 0.7; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>413 Payload Too Large</h1>
    <p>The request body exceeds the server limit.</p>
    <div class="code">HTTP 413</div>
  </div>
</body>
</html>
